<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let n=123,rem,sum=0;
        while(n>0){
            rem=n%10;
            sum=rem+(sum*10);
            n=Math.floor(n/10);
        }
        document.write("reverse number:"+sum);
    </script>
</head>
