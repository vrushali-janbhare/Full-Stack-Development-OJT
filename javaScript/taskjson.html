<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .col-md-5{
            background-color: lightcyan;
        }
        .col-md-7{
            background-color: cornsilk;
        }
        .card-title{
            background-color:cornflowerblue;
        }
    </style>
    <script>
        let students=[];
        let totalstudent=0;
        let passstudent=0;
        let failstudent=0;
        let  percentage; 
        const studentform=()=>{
            totalstudent++;
            let id=Number(document.getElementById("studentid").value);
            let name=document.getElementById("studentname").value;
            let English=Number(document.getElementById("english").value);
            let Maths=Number(document.getElementById("math").value);
           let Science=Number(document.getElementById("science").value);
           let total=English+Maths+Science;
            percentage=Math.floor((total/300)*100);
            let  res="";
            let col=""
           if(percentage>35){
           res="Pass";
            passstudent++;
            col="green";
        }
           else{
            res="Fail";
            failstudent++;
            col="red";
           }
           let st={"RollNo":id,"Name":name,"English":English,"Maths":Maths,"Science":Science,"Total":total,"Percenatge":percentage,"Result":res,"Color":col};
            students.push(st);
            alert("student added succesfully");
            display();
            cleardata();
        }
        const display=()=>{
            let i;
            let data="";
            for(i=0;i<students.length;i++){
                data=data+"<tr ><td>"+students[i].RollNo+"</td><td>"+students[i].Name+"</td> <td>"+students[i].English+"</td><td>"+students[i].Maths+"</td><td>"+students[i].Science+"</td><td>"+students[i].Total+"</td><td>"+students[i].Percenatge+"</td><td style='color:"+students[i].Color+"' >"+students[i].Result+"</td>";
               }
            document.getElementById("tbldata").innerHTML=data;
            document.getElementById("msg1").innerHTML="Total Student ="+totalstudent;
            document.getElementById("msg2").innerHTML="Total Pass Student ="+passstudent;
            document.getElementById("msg3").innerHTML="Total fail Student ="+failstudent;
        }
         const cleardata=()=>{
            document.getElementById("studentid").value="";
            document.getElementById("studentname").value="";
            document.getElementById("english").value="";
            document.getElementById("math").value="";
            document.getElementById("science").value="";

        }
    </script>
    <link rel="stylesheet" href="Bootstrap Files/css/bootstrap.min.css">
    <script src="Bootstrap Files/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="Bootstrap Files/fonts/font/bootstrap-icons.css"></head>
<body>
<div class="card ">   
   <div class="card-header">   
    <h1 class=" card-title">student Form</h1>
    </div>
<div class="card-body">
<div class="row">   
<div class="col-md-5">     
<label>Student Id :</label><br>
<input type="text" id="studentid"/><br><br>
<label>Student Name :</label>  <br>
<input type="text" id="studentname"/><br><br>
<label>English :</label> <br>
<input type="text" id="english"/><br><br>

<label>Math :</label>  <br>
<input type="text" id="math"/><br><br>
<label>Science :</label> <br>
<input type="text" id="science"/><br><br>
<hr/> 
<input type="button"   value="submit"  class="btn btn-primary"onclick="studentform()"/>

</div> 
<div class="col-md-7">    
<table border="1" class="table table-bordered">
    <thead>
        <tr>
            <th>Student Id</th>
            <th>student Name</th>
            <th>English</th>
            <th>Math</th>
            <th>Science</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Result</th>
        </tr>
    </thead>      
    <tbody id="tbldata"></tbody>
    </table>
    </div>
    </div>
    </div>
    </div>
    <div class="mt-3">
    <h4 id="msg1"></h4>
    <h4 id="msg2"></h4>
    <h4 id="msg3"></h4>
    </div>
</body>
</html>
