<script>
    let i;
    document.write("<h3 style='color:orange'>"+"even number green odd number red "+"</h3>");
    for(i=1;i<=50;i++){
        if(i%2==0){
            document.write("<h5 style='color:green'>"+i+"</h5>");

        }
        else{
            document.write("<h5 style='color:red'>"+i+"</h5>");

        }
    }
    
</script>
