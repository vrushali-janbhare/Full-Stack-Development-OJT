<script>
    let n=2,i;
    if(n==2)
    {
           document.write(n+" is  prime");

    }
    else{
        
    
    for(i=3;i<10;i++){
        if(n%i==0){
            document.write(n+" is not prime");
            break;
        }
        else{
                document.write(n+" is  prime");
                break;
        }
    }
}
    
</script>
