<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let students=[];
        let totalstudent=0;
        let passstudent=0;
        let failstudent=0;
        let  percentage; 
        const studentform=()=>{
            totalstudent++;
            let id=Number(document.getElementById("studentid").value);
            let name=document.getElementById("studentname").value;
            let English=Number(document.getElementById("english").value);
            let Math=Number(document.getElementById("math").value);
           let Science=Number(document.getElementById("science").value);
           let total=English+Math+Science;
            percentage=(total/300)*100;
            let  result;
           if(percentage>=35){
           result="P";
            passstudent++;
           }
           else{
            failstudent++;
            result="F";
           }
           let st={"RollNo":id,"Name":name,"English":English,"Math":Math,"Science":Science,"Total":total,"Percenatge":percentage,"Result":result};
            students.push(st);
            alert("student added succesfully");
            display();
            cleardata();
        }
        const display=()=>{
            let i;
            let data=" ";
            for(i=0;i<students.length;i++){
                if(percentage>=35){
                data=data+"<tr><td>"+students[i].RollNo+"</td><td>"+students[i].Name+"</td> <td>"+students[i].English+"</td><td>"+students[i].Math+"</td><td>"+students[i].Science+"</td><td>"+students[i].Total+"</td><td>"+students[i].Percenatge+"</td><td style='color:green'>"+students[i].Result+"</td>";
                    }
                    else{
                    data=data+"<tr><td>"+students[i].RollNo+"</td><td>"+students[i].Name+"</td> <td>"+students[i].English+"</td><td>"+students[i].Math+"</td><td>"+students[i].Science+"</td><td>"+students[i].Total+"</td><td>"+students[i].Percenatge+"</td><td style='color:red'>"+students[i].Result+"</td>";

                    }
            }
            document.getElementById("tbldata").innerHTML=data;
            document.getElementById("msg1").innerHTML="Total Student ="+totalstudent;
            document.getElementById("msg2").innerHTML="Total Pass Student ="+passstudent;
            document.getElementById("msg3").innerHTML="Total fail Student ="+failstudent;
        }
         const cleardata=()=>{
            document.getElementById("studentid").value="";
            document.getElementById("studentname").value="";
            document.getElementById("english").value="";
            document.getElementById("math").value="";
            document.getElementById("science").value="";

        }
    </script>
</head>
<body>
<h1>student Form</h1>
<label>Student Id</label>
<input type="text" id="studentid"/><br><br>
<label>Student Name</label>  
<input type="text" id="studentname"/><br><br>
<label>English</label> 
<input type="text" id="english"/><br><br>

<label>Math</label>  
<input type="text" id="math"/><br><br>
<label>Science</label> 
<input type="text" id="science"/><br><br>
<hr/> 
<input type="button" value="submit" onclick="studentform()"/>

<table border="1">
    <thead>
        <tr>
            <th>Student Id</th>
            <th>student Name</th>
            <th>English</th>
            <th>Math</th>
            <th>Science</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Result</th>
        </tr>
    </thead>      
    <tbody id="tbldata">

    </tbody>
    </table>
    <hr/>
    <h4 id="msg1"></h4>
    <h4 id="msg2"></h4>
    <h4 id="msg3"></h4>

</body>
</html>
