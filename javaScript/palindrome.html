<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    let n=121,rem,sum=0,m=n;
    while(n>0){
        rem=n%10;
        sum=rem+(sum*10);
        n=Math.floor(n/10);
    }
    if(m==sum){
        document.write(m+" is palindrome");
    }
    else{
        document.write(m+" is not palindrome")
    }
    </script>
