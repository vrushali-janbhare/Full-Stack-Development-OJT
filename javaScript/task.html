 <script>
    let i;
    for(i=1;i<21;i++){
        if(i%5==0 && i%3==0){
        document.write(" Fizzbuzz<br>");
        }
        else if(i%5==0){
            document.write("buzz<br>");

        }
        else if(i%3==0){
            document.write("fizz <br>");
        }
        else{
            document.write(i+"<br>");
        }
    }
    </script>
